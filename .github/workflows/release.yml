name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint
        run: shellcheck -S warning src/lib/*.sh src/commands/*.sh src/main.sh src/dispatcher.sh src/cmd_dns.sh src/cmd_infra.sh

      - name: Build
        run: make build

      - name: Smoke test
        run: make test

      - name: Generate checksum
        run: sha256sum wpsite > wpsite.sha256

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## wpsite v${{ steps.get_version.outputs.VERSION }}

            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/src/main.sh) for details.

            ### Installation
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh | bash
            ```
          files: |
            wpsite
            wpsite.sha256
          draft: false
          prerelease: false